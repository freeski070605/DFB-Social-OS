[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dfb-social-os"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "argon2-cffi>=23.1,<26",
  "cryptography>=44,<49", "apscheduler>=3.11,<4", "filelock>=3.17,<4", "tzdata>=2025.1",
  "boto3>=1.35,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
